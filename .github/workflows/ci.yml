name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Version smoke test
        run: .build/debug/layout-saver --version
      - name: Build app bundle
        run: Scripts/build-app.sh
        env:
          LAYOUT_SAVER_INSTALL_DIR: /tmp/layout-saver-ci-applications
