name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Version smoke test
        run: .build/debug/app-snap --version
      - name: Build app bundle
        run: Scripts/build-app.sh
        env:
          APP_SNAP_INSTALL_DIR: /tmp/app-snap-ci-applications
